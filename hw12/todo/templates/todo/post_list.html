<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Blog 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">📋 장고 게시판 과제 (목록 페이지)</h1>
    <nav class="mb-4">
        <a href="/" class="btn btn-outline-primary">홈으로(Landing)</a>
        <a href="/about_me/" class="btn btn-outline-secondary">개발자 자기소개</a>
    </nav>
    <div class="row">
        {% for p in posts %} <div class="col-md-12 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2><a href="{{ p.get_absolute_url }}">{{ p.title }}</a></h2> [cite: 131]
                    <p class="text-muted">작성일: {{ p.created_at }}</p> [cite: 292]
                    <p class="card-text">{{ p.content }}</p> [cite: 288]
                </div>
            </div>
        </div>
        {% empty %}
        <p>게시글이 없습니다. Admin에서 추가해 주세요!</p>
        {% endfor %}
    </div>
</body>
</html>
