<!DOCTYPE html>
<html lang="ko">
<head>
    <title>{{ post.title }} - 상세내용</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="border p-4 rounded bg-light shadow-sm">
        <h1 class="display-5 fw-bold">{{ post.title }}</h1> [cite: 495]
        <p class="text-muted">작성일: {{ post.created_at }}</p> [cite: 498]
        <hr>
        <p class="lead" style="white-space: pre-line;">{{ post.content }}</p> [cite: 496]
        <hr>
        <a href="/blog/" class="btn btn-secondary">← 목록으로 돌아가기</a> [cite: 493]
    </div>
</body>
</html>
