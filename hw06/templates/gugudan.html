<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구구단 출력</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <form id="form_id" method="GET" action="javascript:post_query()">
        <h2>구구단 출력하기</h2>
        <label>단 입력 : 
            <input type="text" name="dan" placeholder="예: 5">
        </label>
        <button type="submit">출력</button>
    </form>

    <hr>
    <div id="results"></div>

    <script>
    function post_query() {
        $.ajax({
            type: "GET",
            url: "/gugudan",
            data: $("#form_id").serialize(),
            success: update_result,
            dataType: "html"
        });
    }

    function update_result(data) {
        $("#results").html(data);
    }
    </script>
</body>
</html>
